name: .NET 10 CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore PADO.AlgorithmLab.slnx
      - name: Build Release
        run: dotnet build PADO.AlgorithmLab.slnx -c Release --no-restore
      - name: Test
        run: dotnet test tests/Pado.AlgorithmLab.Tests/Pado.AlgorithmLab.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
      - name: CLI smoke test
        run: dotnet run --project src/Pado.AlgorithmLab.Cli -c Release --no-build -- --demo
